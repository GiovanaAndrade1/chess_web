services:
  - type: web
    name: chessmatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn chess_web.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /entrar/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chessmatch-db
          property: connectionString

databases:
  - name: chessmatch-db
    plan: free
    databaseName: chessmatch
    user: chessmatch
